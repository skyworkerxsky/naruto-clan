<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>naruto-clan.net</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="header">
    <h1>naruto-clan.net</h1>
    <span id="version" class="version"></span>
  </div>
  <button id="toggle-extension" type="button">Вкл</button>

  <div class="row">
    <span>Озвучка 2x2</span>
    <button id="toggle-voice" type="button" role="switch" aria-label="Озвучка 2x2"></button>
  </div>
  <div class="row">
    <span>Пропустить заставку</span>
    <button id="toggle-skip" type="button" role="switch" aria-label="Пропустить заставку"></button>
  </div>
  <div class="row">
    <span>Пропустить титры</span>
    <button id="toggle-skip-credits" type="button" role="switch" aria-label="Пропустить титры"></button>
  </div>
  <div class="row">
    <span>Следующая серия автоматически</span>
    <button id="toggle-auto-next" type="button" role="switch" aria-label="Следующая серия автоматически"></button>
  </div>

  <footer class="footer">
    <div>Последняя просмотренная серия:</div>
    <div id="last-episode">Сезон — / Серия —</div>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
